<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css">
  <link rel="stylesheet" href="styles4.css">
</head>
<body></body>
<script>

const SUPABASE_URL = 'https://cfstxgxlmkmqklxygvnt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g_paAAmG5U6Vf6v2n8EH_Q_Wnnld1CM';
const participant_id = crypto.randomUUID().slice(0, 10);
let failedSends = 0;
let firstSendError = '';
const pendingTrials = [];
const pendingSaves = [];
let participantInfo = null;
let participantJustification = '';
let finalScore = null;

async function saveTrial(d) {
  const row = {
    participant_id,
    trial_number: d.trial_number,
    stimulus_id: d.stimulus_id,
    file: d.file,
    ground_truth: d.ground_truth,
    response_label: d.response_label,
    correct: d.correct,
    rt: d.rt,
    speaker: d.speaker ?? null,
    sistema_deepfake: d.sistema_deepfake ?? null,
    age: d.age,
    gender: d.gender,
    language: d.language,
    hearing_problem: d.hearing_problem,
    pause_count: d.pause_count,
    replay_count: d.replay_count,
    confidence: d.confidence,
    justifications: d.justifications ?? 'null'
  };

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/responses`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row),
      keepalive: true
    });
    if (!response.ok) {
      const details = await response.text();
      throw new Error(`${response.status}: ${details}`);
    }
  } catch (error) {
    failedSends++;
    if (!firstSendError) firstSendError = error.message;
    console.error('Fallo al guardar el trial', error);
  }
}

async function main() {
  // 1. Leer los CSV de estímulos
  const text = await (await fetch('short_stimuli.csv')).text();
  const stimuli = Papa.parse(text, { header: true, skipEmptyLines: true })
    .data.map(r => ({ ...r, ground_truth: r.ground_truth.trim().toLowerCase() }));
  const exampleText = await (await fetch('example_stimuli.csv')).text();
  const exampleStimuli = Papa.parse(exampleText, { header: true, skipEmptyLines: true })
    .data.map(r => ({
      ...r,
      file: `examples/${r.file.split(/[\\/]/).pop()}`,
      ground_truth: r.ground_truth.trim().toLowerCase()
    }));

  // 2. Inicializar jsPsych
  const jsPsych = initJsPsych({
    on_finish: async () => {
      finalScore = calculateFinalScore();
      if (participantInfo?.isMinor) {
        document.body.innerHTML = `<h2>Gracias por participar</h2><p>Como indicaste que tienes menos de 14 años, tus respuestas no se han guardado.</p><p>Puntuación: <b>${finalScore.totalCorrect} de ${finalScore.totalTrials}</b></p><p>Resultado: <b>${finalScore.percentage}%</b></p>`;
        return;
      }

      document.body.innerHTML = '<p>Guardando respuestas...</p>';
      await Promise.all(pendingSaves);

      if (failedSends > 0) {
        jsPsych.data.get().filter({ task: 'respuesta' })
          .ignore(['task', 'trial_type', 'plugin_version', 'time_elapsed'])
          .localSave('csv', `resultados_${participant_id}.csv`);
        document.body.innerHTML = `<h2>Gracias por participar</h2><p>Algunas respuestas no se pudieron enviar. Se ha descargado una copia local del CSV.</p><p>Puntuación: <b>${finalScore.totalCorrect} de ${finalScore.totalTrials}</b></p><p>Resultado: <b>${finalScore.percentage}%</b></p>`;
        const errorDetails = document.createElement('pre');
        errorDetails.textContent = firstSendError;
        errorDetails.style.whiteSpace = 'pre-wrap';
        document.body.append(errorDetails);
      } else {
        document.body.innerHTML = `<h2>Gracias por participar</h2><p>Respuestas guardadas.</p><p>Puntuación: <b>${finalScore.totalCorrect} de ${finalScore.totalTrials}</b></p><p>Resultado: <b>${finalScore.percentage}%</b></p>`;
      }
    }
  });

  jsPsych.data.addProperties({ participant_id });

  const calculateFinalScore = () => {
    const answers = jsPsych.data.get().filter({ task: 'respuesta' }).values();
    const totalCorrect = answers.reduce((total, answer) => total + answer.correct, 0);
    const percentage = answers.length === 0 ? 0 : Math.round((totalCorrect / answers.length) * 1000) / 10;
    return { totalCorrect, totalTrials: answers.length, percentage };
  };

  // 3. Precarga de los audios de ejemplos y del test
  const preload = {
    type: jsPsychPreload,
    audio: [...exampleStimuli, ...stimuli].map(s => s.file),
    message: '<p>Cargando audios...</p>'
  };

  // 4. Orden aleatorio distinto para cada participante
  const shuffled = jsPsych.randomization.shuffle(stimuli);

  const makeAnswerTrial = (s, i, total, task) => {
    let audioEndedAt = null;
    let answerRt = null;
    let pauseCount = 0;
    let replayCount = 0;
    return ({
      type: jsPsychHtmlButtonResponse,
      stimulus: `<audio class="audio-source" preload="auto" src="${s.file}">Tu navegador no puede reproducir este audio.</audio><div class="audio-control-bar" aria-label="Controles de audio"><button id="audio-replay" class="audio-control-button" type="button" aria-label="Reproducir desde el principio" title="Reproducir desde el principio" disabled>↺</button><button id="audio-toggle" class="audio-control-button" type="button" aria-label="Reanudar audio" title="Reproducir o pausar" disabled>▶</button><input id="audio-seek" type="range" min="0" max="1000" value="0" aria-label="Posición del audio" disabled><span id="audio-time">0:00 / 0:00</span></div>`,
      choices: ['Real', 'Fake'],
      prompt: `<p>${task === 'ejemplo' ? 'Ejemplo' : 'Audio'} ${i + 1} de ${total}</p><div id="confidence-panel" class="confidence-panel" hidden><label for="confidence-slider">Grado de confianza</label><div class="confidence-endpoints"><span>0 · Poca confianza</span><span>5 · Mucha confianza</span></div><input id="confidence-slider" type="range" min="0" max="5" step="0.5" value="2.5" aria-label="Grado de confianza"><output id="confidence-value" for="confidence-slider">2.5</output><button id="confidence-done" class="jspsych-btn" type="button" disabled>Hecho</button></div>`,
      response_ends_trial: false,
      on_load: () => {
        const audio = document.querySelector('#jspsych-content audio');
        const toggleButton = document.querySelector('#audio-toggle');
        const replayButton = document.querySelector('#audio-replay');
        const audioSeek = document.querySelector('#audio-seek');
        const audioTime = document.querySelector('#audio-time');
        const confidencePanel = document.querySelector('#confidence-panel');
        const confidenceSlider = document.querySelector('#confidence-slider');
        const confidenceValue = document.querySelector('#confidence-value');
        const confidenceDone = document.querySelector('#confidence-done');
        const responseButtons = document.querySelectorAll('#jspsych-content button[data-choice]');
        responseButtons.forEach(button => button.disabled = true);
        let playbackFinished = false;
        let selectedResponse = null;
        let confidenceMoved = false;
        const formatTime = seconds => {
          const totalSeconds = Number.isFinite(seconds) ? Math.floor(seconds) : 0;
          return `${Math.floor(totalSeconds / 60)}:${String(totalSeconds % 60).padStart(2, '0')}`;
        };
        const updateAudioDisplay = () => {
          const duration = audio.duration;
          if (Number.isFinite(duration) && duration > 0) {
            audioSeek.value = String(Math.round(audio.currentTime / duration * 1000));
          }
          audioTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(duration)}`;
          const isPlaying = !audio.paused && !audio.ended;
          toggleButton.textContent = isPlaying ? 'Ⅱ' : '▶';
          toggleButton.setAttribute('aria-label', isPlaying ? 'Pausar audio' : 'Reanudar audio');
        };
        const playAudio = () => {
          audio.play().then(() => {
            updateAudioDisplay();
          }).catch(() => {
            if (!playbackFinished) toggleButton.disabled = false;
          });
        };

        toggleButton.addEventListener('click', () => {
          if (audio.ended) return;
          if (!playbackFinished || audio.paused) {
            playAudio();
          } else {
            audio.pause();
          }
        });
        replayButton.addEventListener('click', () => {
          replayCount++;
          audio.currentTime = 0;
          playAudio();
        });
        audio.addEventListener('loadedmetadata', updateAudioDisplay);
        audio.addEventListener('durationchange', updateAudioDisplay);
        audio.addEventListener('timeupdate', updateAudioDisplay);
        audio.addEventListener('seeked', updateAudioDisplay);
        audio.addEventListener('play', () => {
          if (playbackFinished) toggleButton.disabled = false;
          updateAudioDisplay();
        });
        audio.addEventListener('pause', () => {
          if (playbackFinished && !audio.ended) pauseCount++;
          updateAudioDisplay();
        });
        audio.addEventListener('ended', () => {
          if (!playbackFinished) {
            playbackFinished = true;
            audioEndedAt = performance.now();
            replayButton.disabled = false;
            responseButtons.forEach(button => button.disabled = false);
          }
          toggleButton.disabled = true;
          updateAudioDisplay();
        });
        responseButtons.forEach(button => {
          button.addEventListener('click', () => {
            if (selectedResponse !== null) return;
            selectedResponse = Number(button.dataset.choice);
            answerRt = Math.max(0, performance.now() - audioEndedAt);
            confidencePanel.hidden = false;
          });
        });
        confidenceSlider.addEventListener('input', () => {
          confidenceMoved = true;
          confidenceValue.value = confidenceSlider.value;
          confidenceDone.disabled = false;
        });
        confidenceDone.addEventListener('click', () => {
          if (!confidenceMoved || selectedResponse === null) return;
          jsPsych.finishTrial({
            response: selectedResponse,
            rt: answerRt,
            confidence: Number(confidenceSlider.value)
          });
        });
        updateAudioDisplay();
        playAudio();
      },
      data: {
        task,
        trial_number: i + 1,
        stimulus_id: s.stimulus_id,
        file: s.file,
        ground_truth: s.ground_truth,
        speaker: s.speaker,
        sistema_deepfake: s.sistema_deepfake
      },
      on_finish: (d) => {
        d.rt = answerRt;
        d.pause_count = pauseCount;
        d.replay_count = replayCount;
        d.response_label = ['real', 'fake'][d.response];
        d.correct = d.response_label === d.ground_truth ? 1 : 0;
        if (d.task === 'respuesta') {
          Object.assign(d, participantInfo);
          if (!participantInfo.isMinor) pendingTrials.push(d);
        }
      }
    });
  };

  const makeFeedbackTrial = (task, nextLabel) => ({
      type: jsPsychHtmlButtonResponse,
      stimulus: () => {
        const d = jsPsych.data.getLastTrialData().values()[0];
        return `<p style="font-size:1.4em">${d.correct ? '✅ Correcto' : '❌ Incorrecto'}</p>
                <p>Este audio era <b>${d.ground_truth.toUpperCase()}</b>.</p>`;
      },
      choices: [nextLabel],
      data: { task }
  });

  const consentTrial = {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<h2>Consentimiento informado</h2><p>Consentio libere huic studio participare.</p><p><label><input id="consent-checkbox" type="checkbox"> Acepto participar</label></p>',
    choices: ['Continuar'],
    on_load: () => {
      const checkbox = document.querySelector('#consent-checkbox');
      const continueButton = document.querySelector('#jspsych-content .jspsych-btn');
      continueButton.disabled = true;
      checkbox.addEventListener('change', () => {
        continueButton.disabled = !checkbox.checked;
      });
    },
    data: { task: 'consentimiento' }
  };

  let enteredDemographics;
  const demographicsTrial = {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<h2>Datos del participante</h2><p><label for="participant-age">Edad</label><br><input id="participant-age" type="number" min="1" max="120" step="1" required></p><p><label for="participant-gender">Género</label><br><select id="participant-gender" required><option value="">Selecciona una opción</option><option value="mujer">Mujer</option><option value="hombre">Hombre</option><option value="no_binario">No binario</option><option value="otro">Otro</option><option value="prefiero_no_decirlo">Prefiero no decirlo</option></select></p><p><label for="participant-language">Lengua Materna</label><br><input id="participant-language" type="text" required></p><p><label for="participant-hearing-problem">¿Tienes algún problema auditivo?</label><br><select id="participant-hearing-problem" required><option value="">Selecciona una opción</option><option value="si">Sí</option><option value="no">No</option></select></p>',
    choices: ['Continuar'],
    on_load: () => {
      const ageInput = document.querySelector('#participant-age');
      const genderInput = document.querySelector('#participant-gender');
      const languageInput = document.querySelector('#participant-language');
      const hearingProblemInput = document.querySelector('#participant-hearing-problem');
      const continueButton = document.querySelector('#jspsych-content .jspsych-btn');

      const updateContinueState = () => {
        const age = Number(ageInput.value);
        const gender = genderInput.value;
        const language = languageInput.value.trim();
        const hearing_problem = hearingProblemInput.value;
        continueButton.disabled = !Number.isInteger(age) || age < 1 || age > 120 ||
          !gender || !language || !hearing_problem;
        if (!continueButton.disabled) {
          enteredDemographics = { age, gender, language, hearing_problem };
        }
      };

      continueButton.disabled = true;
      [ageInput, genderInput, languageInput, hearingProblemInput].forEach(input => {
        input.addEventListener('input', updateContinueState);
        input.addEventListener('change', updateContinueState);
      });
    },
    on_finish: () => {
      participantInfo = {
        ...enteredDemographics,
        isMinor: enteredDemographics.age < 14
      };
    },
    data: { task: 'datos_participante' }
  };

  const exampleTrials = [
    {
      type: jsPsychHtmlButtonResponse,
      stimulus: '<h2>Ejemplos</h2><p>Antes de empezar, escucharás dos audios de práctica. En cada uno, indica si la voz te parece real o generada artificialmente. Después verás la respuesta correcta.</p>',
      choices: ['Comenzar ejemplos'],
      data: { task: 'instrucciones_ejemplos' }
    },
    ...exampleStimuli.flatMap((s, i) => [
      makeAnswerTrial(s, i, exampleStimuli.length, 'ejemplo'),
      makeFeedbackTrial(
        'feedback_ejemplo',
        i === exampleStimuli.length - 1 ? 'Continuar al test' : 'Siguiente ejemplo'
      )
    ])
  ];

  // 5. Trials principales: respuesta + feedback por cada audio
  const trials = shuffled.flatMap((s, i) => [
    makeAnswerTrial(s, i, shuffled.length, 'respuesta'),
    makeFeedbackTrial('feedback', 'Siguiente')
  ]);

  trials.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: '<h2>Tu valoración</h2><p><label for="participant-justification">¿Qué rasgos has tenido en cuenta para detectar un deepfake?</label></p><textarea id="participant-justification" rows="6" required></textarea>',
    choices: ['Hecho'],
    on_load: () => {
      const textArea = document.querySelector('#participant-justification');
      const doneButton = document.querySelector('#jspsych-content .jspsych-btn');
      doneButton.disabled = true;
      textArea.addEventListener('input', () => {
        participantJustification = textArea.value.trim();
        doneButton.disabled = participantJustification.length === 0;
      });
    },
    on_finish: () => {
      if (!participantInfo?.isMinor) {
        pendingSaves.push(...pendingTrials.map(trial => saveTrial({
          ...trial,
          justifications: 'null'
        })));
        pendingSaves.push(saveTrial({
          participant_id,
          trial_number: null,
          stimulus_id: 'null',
          file: 'null',
          ground_truth: 'null',
          response_label: 'null',
          correct: null,
          rt: null,
          speaker: 'null',
          sistema_deepfake: 'null',
          age: participantInfo.age,
          gender: participantInfo.gender,
          language: participantInfo.language,
          hearing_problem: participantInfo.hearing_problem,
          pause_count: null,
          replay_count: null,
          confidence: null,
          justifications: participantJustification
        }));
      }
    },
    data: { task: 'justificacion' }
  });

  trials.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: () => {
      const responses = jsPsych.data.get().filter({ task: 'respuesta' });
      const score = calculateFinalScore();

      responses.addToAll({
        total_correct: score.totalCorrect,
        total_trials: score.totalTrials,
        score_percentage: score.percentage
      });

      return `<h2>Test finalizado</h2>
              <p style="font-size:1.4em">Puntuación: <b>${score.totalCorrect} de ${score.totalTrials}</b></p>
              <p>Resultado: <b>${score.percentage}%</b></p>`;
    },
    choices: ['Finalizar'],
    data: { task: 'resultado' }
  });

  jsPsych.run([preload, consentTrial, demographicsTrial, ...exampleTrials, ...trials]);
}

main();
</script>
</html>
